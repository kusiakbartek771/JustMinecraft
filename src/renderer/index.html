<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; media-src * data: blob:; connect-src 'self'; font-src 'self' data:" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JustMinecraft</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="bg" aria-hidden="true">
    <div id="bg-grad"></div>
    <div id="bg-image"></div>
    <div id="bg-dim"></div>
  </div>
  <div id="app">
    <header id="titlebar">
      <div class="tb-brand"><img src="../../assets/icon.png" alt="" /><span>JustMinecraft</span></div>
      <div class="tb-drag"></div>
      <div id="tb-right"></div>
      <div id="win-controls"></div>
    </header>
    <div id="body">
      <nav id="sidebar"></nav>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>
  <div id="drop-overlay"><div><span id="drop-ic"></span><b>Upuść pliki, aby dodać je do instancji</b><small>mody .jar, resource packi, shadery, datapacki .zip i modpacki .mrpack</small></div></div>
  <div id="modals"></div>
  <div id="toasts"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
